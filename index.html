:root{--ink:#17283e;--teal:#087f84}*{box-sizing:border-box}body{margin:0;background:#edf3f6;color:var(--ink);font:17px/1.55 system-ui}header{background:#132d43;color:white;padding:35px max(5vw,20px)}header p{color:#a9dce1}h1{font-size:clamp(27px,4vw,42px);margin:5px 0}nav{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}button,select,input,textarea{font:inherit}button{border:0;border-radius:9px;padding:11px 18px;background:var(--teal);color:white;cursor:pointer}button.secondary{background:#e0eaee;color:var(--ink)}nav button{background:#28485f}nav button.active{background:#18a5a4}main{max-width:1150px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 3px 14px #17334a08}h2{margin-top:0}label{display:inline-flex;align-items:center;gap:10px;margin:8px 18px 8px 0}input[type=range]{width:180px}input:not([type=range]),textarea{border:1px solid #b6c9d3;border-radius:6px;padding:8px;width:100%;color:var(--ink);background:#fff}textarea{min-height:110px;resize:vertical}.identity{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.identity label{display:block}svg{width:100%;max-height:490px;background:#f5fafc;border-radius:12px}.readout{background:#e7f6f4;padding:12px 18px;border-radius:8px;margin:10px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:580px}th,td{border:1px solid #c3d2d9;padding:9px;text-align:center}th{background:#e9f2f4}td input{min-width:65px}.hint{color:#536c7b;font-size:15px}details{margin:14px 0}summary{cursor:pointer;font-weight:650}.hidden{display:none}ol li{margin:8px 0}a{color:#087f84}footer{text-align:center;color:#536c7b;padding:25px}@media(max-width:650px){main{padding:12px}.card{padding:16px}.identity{grid-template-columns:1fr}label{display:flex;flex-wrap:wrap}}@media print{header,nav,.controls,button,footer{display:none}body{background:white;font-size:12px}.card{box-shadow:none;break-inside:avoid;padding:10px}main{padding:0}textarea{min-height:70px}svg{max-height:250px}details{display:block}table{min-width:0}input{border:0!important}h2{font-size:18px}}
</style><header><small>ФІЗИКА • 9 КЛАС</small><h1>Світло і звук</h1><p>Досліджуй. Вимірюй. Роби власні висновки.</p><nav><button data-tab="3">№3 · Відбивання</button><button data-tab="4">№4 · Заломлення</button><button data-tab="6">№6 · Звук</button></nav></header><main><div class="card identity"><label>Ім’я та прізвище<input id="student"></label><label>Клас<input id="grade"></label><label>Дата<input type="date" id="date"></label></div><div id="content"></div><div class="card"><h2>Мій звіт</h2><label style="display:block">Обчислення та пояснення<textarea id="calc"></textarea></label><label style="display:block">Висновок<textarea id="conclusion"></textarea></label><p class="hint">Записи зберігаються в цьому браузері. На спільному пристрої завантаж свій звіт і очисть записи після роботи.</p><button id="print">Друкувати / зберегти PDF</button> <button id="export">Завантажити звіт (.txt)</button> <button class="secondary" id="clear">Очистити цю роботу</button><span id="status" role="status"></span></div></main><footer>Навчальні моделі • Таблиці та обчислення учень заповнює самостійно</footer><script>
const $=s=>document.querySelector(s);let current=['3','4','6'].includes(location.hash.slice(1))?location.hash.slice(1):'3',audio,osc,gain,playing=false,phase=0;const data={};try{Object.assign(data,JSON.parse(localStorage.getItem('anna-optics-sound-v1')||'{}'))}catch(e){}const state={angle:40,material:'water',freq:440,amp:0.25,length:12,source:'tone'};
const titles={3:'Дослідження відбивання світла',4:'Дослідження заломлення світла',6:'Дослідження звукових коливань'};
function table(id,heads,rows){return `<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${Array.from({length:rows},(_,r)=>`<tr><td>${r+1}</td>${heads.slice(1).map((h,c)=>`<td><input aria-label="${h}, дослід ${r+1}" id="${id}-${r}-${c}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function save(){const d={};document.querySelectorAll('main input,main textarea').forEach(x=>d[x.id]=x.value);data[current]=d;try{localStorage.setItem('anna-optics-sound-v1',JSON.stringify(data));$('#status').textContent=' Збережено'}catch(e){$('#status').textContent=' Збереження недоступне — завантаж звіт'}}
function stop(){if(osc){osc.stop();osc.disconnect();osc=null}playing=false;let b=$('#sound');if(b)b.textContent='Увімкнути звук'}
function render(){stop();$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===current));let text=`<section class="card"><small>ЛАБОРАТОРНА РОБОТА №${current}</small><h2>${titles[current]}</h2>`;
if(current==='3'||current==='4'){let ref=current==='3';text+=`<p><b>Мета:</b> ${ref?'експериментально перевірити закони відбивання світла.':'визначити показник заломлення води та скла відносно повітря.'}</p><ol><li>Зміни напрям падаючого променя повзунком або перетягни джерело на рисунку.</li><li>Виміряй кути транспортиром від нормалі — пунктирної лінії. Верхня й нижня півшкали мають нуль уздовж нормалі.</li><li>${ref?'Проведи 5 дослідів за різних кутів. Занеси виміряні α та β до таблиці.':'Проведи по 3 досліди для води й скла за різних ненульових кутів. Обчисли синуси (режим DEG) і n₂₁.'}</li></ol><div class="controls"><label>Напрям джерела<input id="angle" type="range" min="5" max="80" value="40"></label>${ref?'':`<label>Середовище<select id="material"><option value="water">Вода</option><option value="glass">Скло</option></select></label>`}<label><input type="checkbox" id="read" style="width:auto"> Показати числові кути після вимірювання</label></div><svg id="scene" viewBox="0 0 800 460" role="img" aria-label="Промені світла та транспортир"></svg><div class="readout" id="measure">Виміряй кути за шкалою.</div><p class="hint">Модель ідеальна: промені та нормаль лежать в одній площині. ${ref?'Плоске дзеркало відбиває промінь без заломлення.':'Показники середовищ у моделі сталі; дисперсією знехтувано. Слабкий відбитий промінь не показаний.'}</p></section><section class="card"><h2>Результати вимірювань</h2>`;
if(ref)text+=table('reflection',['№','Кут падіння α, °','Кут відбивання β, °'],5)+`<p>Зістав α та β. Чи збігаються результати? Поясни можливу похибку зчитування.</p>`;
else{for(const [id,name]of [['water','Вода'],['glass','Скло']])text+=`<h3>${name}</h3>`+table(id,['№','α, °','γ, °','sin α','sin γ','n₂₁'],3);text+='<p><b>Формула:</b> n₂₁ = sin α / sin γ. За α = 0° цей спосіб дає невизначеність 0/0: використовуй ненульові кути.</p><p>Порівняй результати трьох дослідів. Чи залежить показник заломлення від кута падіння?</p>'}
text+=`</section><section class="card"><details><summary>Теорія та контрольні запитання</summary>${ref?'<p>Кут падіння дорівнює куту відбивання. Падаючий промінь, відбитий промінь і нормаль у точці падіння лежать в одній площині.</p><ol><li>Чому запітнілі окуляри погіршують видимість?</li><li>Порівняй відстані від предмета до дзеркала та від дзеркала до зображення.</li><li>Як нахилити дзеркало до горизонту, щоб за висоти Сонця 30° спрямувати промені вертикально вниз?</li></ol><p>Творче завдання: склади план вимірювання висоти кімнати за допомогою плоского дзеркала.</p>':'<p>n₁ sin α = n₂ sin γ. Падаючий промінь, заломлений промінь і нормаль лежать в одній площині. При переході з повітря у воду або скло промінь наближається до нормалі.</p><ol><li>Як відхиляється промінь при переході з води у повітря, якщо заломлення можливе?</li><li>Де швидкість світла більша: у склі чи в алмазі з більшим показником заломлення?</li><li>Намалюй хід променя крізь плоскопаралельну скляну пластинку.</li></ol><p>Творче завдання: запропонуй домашній дослід із визначення показника заломлення води.</p>'}</details></section>`;
}else{text+=`<p><b>Мета:</b> дослідити зв’язок амплітуди з гучністю та частоти з висотою тону.</p><p>Це генератор ідеалізованого звуку, а не запис мікрофона. Відносний рівень у дБ обчислюється щодо амплітуди 1 і не є виміряним рівнем звукового тиску в кімнаті.</p><ol><li>За сталої частоти порівняй дві амплітуди.</li><li>За сталої амплітуди зміни частоту; досліди ноти.</li><li>Обери лінійку: порівняй два відхилення за сталої довжини, потім зміни довжину.</li></ol><div class="controls"><label>Джерело<select id="source"><option value="tone">Чистий тон</option><option value="ruler">Лінійка</option></select></label><label>Частота, Гц<input id="freq" type="range" min="100" max="1200" value="440"></label><label>Амплітуда, відн. од.<input id="amp" type="range" min="0.02" max="0.8" step="0.01" value="0.25"></label><label>Виступ лінійки, см<input id="length" type="range" min="6" max="20" value="12"></label><label>Нота (4-та октава)<select id="note"><option value="">Обери</option>${[['До',261.63],['Ре',293.66],['Мі',329.63],['Фа',349.23],['Соль',392],['Ля',440],['Сі',493.88]].map(([n,f])=>`<option value="${f}">${n}</option>`).join('')}</select></label><button id="sound">Увімкнути звук</button><p class="hint">Почни з малої гучності пристрою. Звук вмикається лише кнопкою.</p></div><svg id="scene" viewBox="0 0 800 360" role="img" aria-label="Осцилограма звуку"></svg><div id="measure" class="readout"></div><p class="hint">Графік показує 20 мс. Лінійка: f = 440 · (12 / L)²; матеріал і товщина сталі. Модель малих коливань, без затухання; звук відтворюється основним тоном.</p></section><section class="card"><h2>1. Амплітуда і гучність</h2>${table('loud',['№','Опис звуку','A, відн. од.','f, Гц','Відносний рівень, дБ'],2)}<h2>2. Висота тону</h2>${table('notes',['№','Нота','f, Гц','T, с'],7)}<p>T = 1 / f. Порівняй висоту тону та частоту.</p><h2>3. Коливання лінійки</h2>${table('ruler',['№','L, см','A, відн. од.','f, Гц','Відносний рівень, дБ'],3)}<p>Досліди 1–2: та сама довжина, різні амплітуди. Дослід 3: інша довжина за тієї самої амплітуди, що в досліді 2.</p></section><section class="card"><details><summary>Теорія, контрольні та творчі завдання</summary><p>Висота тону залежить насамперед від частоти. За незмінних інших умов більша амплітуда відповідає більшій інтенсивності й зазвичай більшій гучності. Гучність — суб’єктивне відчуття; інтенсивність — фізична величина.</p><p>Відносний рівень: ΔL = 20 lg(A / A₀), A₀ = 1. Від’ємні значення означають рівень нижчий за обрану опору.</p><ol><li>Які характеристики хвилі змінюються при переході в інше середовище?</li><li>Чому зачинене вікно послаблює вуличний шум?</li><li>Відлуння повернулося через 2 с. Знайди відстань до перешкоди, якщо v = 340 м/с.</li></ol><p>Творче завдання: склади план порівняння звукопоглинання різними матеріалами. Поясни, як забезпечити однакові умови.</p></details></section>`}
$('#content').innerHTML=text;const d=data[current]||{};document.querySelectorAll('main input,main textarea').forEach(x=>{if(x.type!=='range'&&x.type!=='checkbox')x.value=d[x.id]||''});$('#calc').value=d.calc||'';$('#conclusion').value=d.conclusion||'';$('#status').textContent='';
if(current!=='6'){state.angle=40;state.material='water';$('#angle').oninput=e=>{state.angle=+e.target.value;draw()};if($('#material'))$('#material').onchange=e=>{state.material=e.target.value;draw()};$('#read').onchange=draw;let drag=false;$('#scene').onpointerdown=e=>{drag=true;$('#scene').setPointerCapture(e.pointerId);move(e)};$('#scene').onpointermove=e=>{if(drag)move(e)};$('#scene').onpointerup=()=>drag=false;$('#scene').onpointercancel=()=>drag=false;function move(e){const p=$('#scene').createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform($('#scene').getScreenCTM().inverse());if(q.x<400&&q.y<230){state.angle=Math.max(5,Math.min(80,Math.atan2(400-q.x,230-q.y)*180/Math.PI));$('#angle').value=state.angle;draw()}}}else{Object.assign(state,{freq:440,amp:.25,length:12,source:'tone'});['freq','amp','length','source'].forEach(id=>$('#'+id).oninput=e=>{state[id]=id==='source'?e.target.value:+e.target.value;updateSound();draw()});$('#note').onchange=e=>{if(e.target.value){state.source='tone';$('#source').value='tone';state.freq=+e.target.value;$('#freq').value=state.freq;updateSound();draw()}};$('#sound').onclick=async()=>{if(playing){stop();return}try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();await audio.resume();osc=audio.createOscillator();gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);playing=true;updateSound();osc.start();$('#sound').textContent='Зупинити звук'}catch(e){$('#measure').textContent='Звук недоступний у цьому браузері. Графік працює.'}}}draw()}
function line(x,y,a,b,color,width=3,dash=''){return `<line x1="${x}" y1="${y}" x2="${a}" y2="${b}" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''}/>`}function label(x,y,t,size=15,color='#35566b'){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" fill="${color}">${t}</text>`}function ray(x,y,a,b,color){return line(x,y,a,b,color,4)+`<path d="M-11 -6 L0 0 L-11 6" fill="none" stroke="${color}" stroke-width="3" transform="translate(${x+(a-x)*.62} ${y+(b-y)*.62}) rotate(${Math.atan2(b-y,a-x)*180/Math.PI})"/>`}
function draw(){let svg=$('#scene');if(!svg)return;if(current==='6'){let f=frequency(),a=state.amp;let s='';for(let i=0;i<=10;i++){let x=60+i*68;s+=line(x,40,x,290,'#d5e3e9',1)+label(x,315,i*2)}s+=line(60,165,750,165,'#829aa8',1)+label(400,348,'Час, мс')+label(95,25,'A, відн. од.');s+=label(30,65,'+0,8')+label(30,170,'0')+label(30,275,'−0,8');let p='';for(let x=0;x<=680;x++){let y=165-125*a/.8*Math.sin(2*Math.PI*f*x/680*.02);p+=(x?'L':'M')+(60+x)+' '+y}svg.innerHTML=s+`<path d="${p}" fill="none" stroke="#087f84" stroke-width="3"/>`;$('#measure').textContent=`f = ${f.toFixed(2)} Гц · A = ${a.toFixed(2)} · ΔL = ${(20*Math.log10(a)).toFixed(1)} дБ`;$('#freq').disabled=state.source==='ruler';$('#length').disabled=state.source!=='ruler';return}
let ref=current==='3',a=state.angle*Math.PI/180,g=Math.asin(Math.sin(a)/(state.material==='water'?1.333:1.5)),s=`<rect width="800" height="230" fill="#f7fbff"/><rect y="230" width="800" height="230" fill="${ref?'#dde4e9':'#d4eeed'}"/>`;s+=line(20,230,780,230,'#4b6c80',4)+line(400,15,400,445,'#7996a8',2,'7 5');s+=label(680,45,ref?'Повітря':'Повітря · середовище 1')+label(665,420,ref?'Плоске дзеркало':(state.material==='water'?'Вода':'Скло')+' · середовище 2');for(let d=0;d<360;d+=5){let t=d*Math.PI/180,r=d%10?146:140;s+=line(400+r*Math.sin(t),230-r*Math.cos(t),400+155*Math.sin(t),230-155*Math.cos(t),'#9aadb7',1);if(d%10===0){let n=d<=90?d:d<=180?180-d:d<=270?d-180:360-d;s+=label(400+174*Math.sin(t),235-174*Math.cos(t),n,12)}}let sx=400-212*Math.sin(a),sy=230-212*Math.cos(a);s+=ray(sx,sy,400,230,'#e47720');s+=ref?ray(400,230,400+212*Math.sin(a),230-212*Math.cos(a),'#087f84'):ray(400,230,400+212*Math.sin(g),230+212*Math.cos(g),'#087f84');s+=`<circle cx="${sx}" cy="${sy}" r="12" fill="#e47720" stroke="white" stroke-width="3"/>`+label(sx,sy-20,'Джерело',14)+label(440,20,'Нормаль',13);svg.innerHTML=s;$('#measure').textContent=$('#read').checked?`α = ${state.angle.toFixed(1)}° · ${ref?'β = '+state.angle.toFixed(1):'γ = '+(g*180/Math.PI).toFixed(1)}°`:'Виміряй кути за шкалою. Кути відраховують від нормалі.'}
function frequency(){return state.source==='ruler'?440*(12/state.length)**2:state.freq}function updateSound(){if(playing&&osc){osc.frequency.setTargetAtTime(frequency(),audio.currentTime,.02);gain.gain.setTargetAtTime(state.amp*.12,audio.currentTime,.02)}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{save();current=b.dataset.tab;location.hash=current;render()});document.querySelector('main').addEventListener('input',e=>{if(e.target.matches('textarea,input:not([type=range]):not([type=checkbox])'))save()});$('#print').onclick=()=>{stop();save();window.print()};$('#export').onclick=()=>{save();let t=`Лабораторна робота №${current}\n${titles[current]}\n\n`;document.querySelectorAll('.identity input').forEach(x=>t+=x.closest('label').textContent+': '+x.value+'\n');document.querySelectorAll('#content table').forEach(tab=>{let h=tab.previousElementSibling;t+='\n'+(h?h.textContent:'Результати')+'\n';tab.querySelectorAll('tr').forEach(r=>{t+=[...r.cells].map(c=>c.querySelector('input')?.value??c.textContent).join('\t')+'\n'})});t+='\nОбчислення:\n'+$('#calc').value+'\n\nВисновок:\n'+$('#conclusion').value;let url=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=`laboratory-${current}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#clear').onclick=()=>{if(confirm('Очистити записи лише поточної роботи?')){delete data[current];try{localStorage.setItem('anna-optics-sound-v1',JSON.stringify(data))}catch(e){}render()}};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script></html>
